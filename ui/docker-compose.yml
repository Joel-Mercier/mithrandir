services:
  mithrandir-ui:
    build:
      context: ..
      dockerfile: ui/Dockerfile
    container_name: mithrandir-ui
    ports:
      - "4180:4180"
    env_file:
      - .env
      - ../.env
    environment:
      - DB_FILE_NAME=file:/app/data/local.db
      - BETTER_AUTH_URL=http://localhost:4180
    group_add:
      - "992"
    volumes:
      - mithrandir-ui-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  mithrandir-ui-data:
